function hex(number, length) {
    var str = (number.toString(16)).toUpperCase();
    while (str.length < length) str = '0' + str;
    return str;
}
function dump(ar, len) {
	let s = '';
	for(let i=0; i < len; i++) {
		s += hex(ar[i],2);
	}
	return s;
}
function ResponsePkt(value) {
	let ds = value.byteLength;
	let s = 'msg: ';
    for(let i=0; i < ds; i++) {
		s+=' '+hex(value.getUint8(i),2);
		if(i<ds-1) s+=',';
	}
	Clog(s);
}

/*
memo[0] es la última caputra de temperatura. Osea que el dispositivo primero envía la última captura y la final la mas vieja
[
    1792144808,
    17.11,
    55.14,
    2729
]

*/

function show_graph() {
	if (memo.length > 1) {
		let hideldate = $('hideLoDate').checked;
		// let displayed_graph = document.getElementsByName('displayed_graph'); // 'temperature' / 'temperature_and_humidity' / 'battery_voltage'
        let graphType = GraphType.getSelectedType();
		datau = [];

		memo.reduceRight(function (a, b) {		// La función recorre el arreglo memo desde el último elemento hasta el primero (al revés) usando reduceRight. Cada registro b contiene un arreglo con cuatro posiciones: b[0]: Marca de tiempo (timestamp en segundos). b[1]: Temperatura. b[2]: Humedad. b[3]: Voltaje de la batería.
			// in this context variable b contains row of data from sensor
			// b[0] = timestamp; b[1] = temperature; b[2] = humidity; b[3] = battery voltage
			if (!hideldate || (b[0] > 1609459200 && b[0] < 2255486400)) {     // Si el checkbox de ocultar fechas (hideldate) no está marcado, el dato pasa directamente. Si sí está marcado, el registro solo se procesa si su marca de tiempo está dentro del rango Unix entre el 1 de enero de 2021 y el 15 de mayo de 2041.
				let data = []
				switch (graphType) {
                    case GraphType.TEMPERATURE:
						data = [b[1]];
						break;
                    case GraphType.TEMPERATURE_AND_HUMIDITY:
						data = [b[1], b[2]];
						break;
                    case GraphType.BATTERY_VOLTAGE:
						data = [b[3] / 1000.0];
						break;
					default:
						throw Error('Invalid GraphType instance ' + graphType);
				}
				datau.push([new Date(b[0] * 1000.0 + localOffset), ...data]);		// Cuidado: Intercambia orden. el localOffset es x lo de la hora UTC
			}
			return a + 1;
		}, 1);

		//Clog('Loaded ' + datau.length + ' samples.')
		if (datau.length > 1) {
            ShowGraph(graphType);
		} else Clog('No samples!')
	}
}

let deviceCache = null;

// Inicia la selección del dispositivo Bluetooth y conéctese al dispositivo seleccionado.
function connect() {
	devcnn = 0;
	redevcnn = 0;
	return (deviceCache ? Promise.resolve(deviceCache) :
		requestBluetoothDevice()).
		then(device => connectDeviceAndCacheCharacteristic(device)).
		catch(error => {
			Clog(error); 
			ShowConnect();});
}

// Solicitud de selección de dispositivo Bluetooth
function requestBluetoothDevice() {
	var deviceOptions = {optionalServices: [0xfe95, 0x181a, 0x1f10]};
	const namePrefix = $('namePrefix').value;
	if (namePrefix) {
		deviceOptions.acceptAllDevices = false;
		deviceOptions.filters = namePrefix.split(",")
			.map((x) => ({ namePrefix: x }));
	} else {
		deviceOptions.filters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ abcdefghijklmnopqrstuvwxyz_#@!*0123456789';,.<>{}[]"
		.split("").map((x) => ({namePrefix:x}));
	}
	// deviceOptions.filters.services = [0xfe95, 0x181a, 0x1f10];
	Clog('Requesting bluetooth device...');
	return navigator.bluetooth.requestDevice(deviceOptions).	// Solicitud al usuario de seleccionar dispositivo BT
	then(device => {
		Clog('"' + device.name + '" bluetooth device selected');
		deviceName = device.name;
		deviceCache = device;
		deviceConnected = device.name;
		deviceCache.addEventListener('gattserverdisconnected', handleDisconnection);
		return deviceCache;
	});
}
// Gestión de la desconexión del dispositivo BT
function handleDisconnection(event) {
	let device = event.target;
    ShowConnect();
	if(devcnn == 0 && ++redevcnn < 5) {
		Clog('"' + device.name + '" bluetooth device disconnected, trying to reconnect...');
		connectDeviceAndCacheCharacteristic(device).
		catch(error => Clog(error));};
}



//  API Web Bluetooth para comunicarse con un dispositivo físico (como un termómetro) desde el navegador web
var start_time;
// Conexión a un dispositivo específico, obtención de un servicio y características
function connectDeviceAndCacheCharacteristic(device) {
  if (device.gatt.connected && characteristicVTH) {
  	return Promise.resolve(null);
  }
  Clog('Connecting to GATT server...');
  return device.gatt.connect().									// Device >> Server >> Service >> Characteristic 
	then(server => {
		Clog('GATT server connected, getting service...');
		return server.getPrimaryService(0x1F10);
	}).then(service => {
		Clog('Service found, getting characteristic...');
		return service.getCharacteristic(0x1F1F);
	}).
	then(characteristic => {
		Clog('Characteristic found');
		characteristicVTH = characteristic;		// Guarda la característica en una variable global
		devcnn = 1;								// Bandera de estado: Dispositivo conectado
		ShowConnect();							// Actualiza la interfaz gráfica de la web
		Clog('Start Notifications...');
		return characteristicVTH.startNotifications().		//  Le dice al termómetro que, cada vez que cambie la temperatura o el estado, envíe el dato automáticamente sin que la web tenga que preguntarle continuamente.
		then(_ => {
			Clog('Notifications Started');
			characteristicVTH.addEventListener('characteristicvaluechanged', event => {			// Cada vez que el dispositivo envía datos, se dispara este evento.
				var value = event.target.value;
				let len = value.byteLength;
				if(len > 0) {								// El código mira el primer byte (blkid) para saber qué tipo de información ha llegado.
					let blkid = value.getUint8(0);
					
					if(blkid == 0x35) {						// Caso -B-: Recepción historial temperaturas. ---------------------------------------------
						ResponsePkt(value);									// Imprime los valores en el Log
						if(len >= 13) {										// msg:   35, 16, 01, 02, A7, CE, 6A, 05, 0A, 82, 12, 73, 09   (en este caso len=13)
							let cnt = value.getUint16(1, true);				// 16, 01: > 0116Hex > En hexadecimal. Contador del número de dato enviado. Último=36Hex = 
							let tc = value.getUint32(3, true);				// Hora > 02, A7, CE, 6A (pone 32 asique 8 bytes)
							let tm = value.getInt16(7, true) / 100.0;		// Temperatura > 05, 0A
							let hm = value.getUint16(9, true) / 100.0;		// Humedad > 82, 12
							let vb = value.getUint16(11, true);				// Batería > 73, 09
							/* Slow speed on some devices!
							let dt = new Date(tc*1000);
							console.log('Memo '+((dt.toISOString().slice(0, -1)).replace('T',' ')).replace('.000','')+' - Vbat: '+vb+' mV , Temp: '+tm+'°C, Humi: '+hm+'%, Count: '+cnt);
							*/
							log('Read Count: '+cnt);
							memo.push([tc,tm,hm,vb]);
							show_on = 1;
						} else if(len >= 3) {								// msg:  35, 00, 00			Creo que es el fin del envio de datos.
							console.log('Read count: '+ memo.length);		// Read count: 310
							console.log('Read time: ' + ((Date.now() - start_time)/1000).toFixed(3) + ' sec');		// Read time: 0.315 sec
							let time = Date.now()/1000;
							time -= (new Date()).getTimezoneOffset() * 60;
							blk = new Uint8Array(5);						// Construimos cadena con datos a enviar 
							blk[0] = 0x23;									// Comando de establecer hora: 0x23
							blk[1] = time & 0xff;
							blk[2] = (time >> 8) & 0xff;
							blk[3] = (time >> 16) & 0xff;
							blk[4] = (time >> 24) & 0xff;
							console.log("Send cmd Set DevTime ("+dump(blk, blk.length)+")...");		// Send cmd Set DevTime (236EECCF6A)...
							characteristicVTH.writeValue(blk).then(_ => {
								console.log('Send new DevTime ok');									// Send new DevTime ok
							});
						} else if(len == 2) {								// Esto no se lo que es.
							 memogetcont = value.getUint16(1, true);
						}
					} else if(blkid == 0x23 && len >= 4) {		// Caso -C-: El dispositivo devuelve su hora. ---------------------------------------------
						let time = value.getUint32(1,true);
						console.log('Device Time: 0x' + hex(time,8));		// Device Time: 0x6ACFEC6E
						let dt = new Date(time*1000);
						console.log('Device Date: '+(dt.toISOString().slice(0, -1)).replace('T',' '));		// Device Date: 2026-10-14 20:56:14.000
						
						// MODIFICACIÓN: En lugar de desconectar directo, pedimos la lectura actual
						Clog('Sincronización de hora lista. Solicitando temperatura actual...');
						characteristicVTH.writeValue(new Uint8Array([0x33])).catch(error => {
							Clog('Error al solicitar lectura actual: ' + error);
							disconnect();
						});
					} else if(blkid == 0x33 && len >= 7) {		// NUEVO CASO -D-: Captura y muestra de datos en tiempo real. ---------------------------------------------
						let tm = value.getInt16(3, true) / 100.0;
						let hm = value.getUint16(5, true) / 100.0;
						let vb = value.getUint16(7, true);
						
						console.log(`Temperatura Actual: ${tm.toFixed(1)} °C`);
						console.log(`Humedad Actual: ${hm.toFixed(0)} %`);
						console.log(`Batería: ${vb} mV`);						
						temperaturaActual = tm.toFixed(2);
						//temperaturaTendencia = temperaturaActual - memo[memo.length-2][1];
						temperaturaTendencia = (temperaturaActual - memo[1][1]).toFixed(2);	// memo[0][1], es el registro mas reciente, el [1][1] el 5 minutos anterior.
						humedadActual =  hm.toFixed(0);
						Clog ("Temp: " + temperaturaActual + "ºC");
						
						disconnect();							// >>> Desconexión final trasladada aquí
					
					} else if(blkid == 0x55){ 		// CASO -A- Recepción Configuración del dispositivo. ---------------------------------------------
						if(len >= 12) {
							memo = new Array();
							datau = new Array();
							/* let av_meas_mem = value.getUint8(6) * 62.5 * value.getUint8(7) * value.getUint8(12);
							if(av_meas_mem == 0) av_meas_mem = 600;
							av_meas_mem /= 1000;
							console.log('Memos storage interval: ' + av_meas_mem + ' sec'); */
							memogetcont = parseInt($("LoadSamples").value);
							if(isNaN(memogetcont) || memogetcont > MAX_MEMORES) memogetcont = MAX_MEMORES;
							else if(memogetcont < 5) memogetcont = 5;
							if(memogetcont == MAX_MEMORES)
								Clog('Send command "get-memo all samples"...');
							else
								Clog('Send command "get-memo '+memogetcont+' samples"...');
							start_time = Date.now();
							characteristicVTH.writeValue(new Uint8Array([0x35,memogetcont&0xff, (memogetcont>>8)&0xff,0,0]))		// Le decimos que nos mande los "memogetcont" valores
							.catch(error => {Clog(error); disconnect();});
						} else {
							Clog('Error device config!');
							disconnect();
						}
					} else {
						ResponsePkt(value);
					}
				}
			});
			DevConnected();
			Clog('Get device config...');
			setTimeout(function() {
				console.log('Send command "get config"...');
				characteristicVTH.writeValue(new Uint8Array([0x55])).catch(error => {
					log(error); 
					disconnect();
					})
			}, 1500);
		  	return Promise.resolve(null);
		});
	});
}





// Отключиться от подключенного устройства
function disconnect() {
	devcnn = 0;
	redevcnn = 55;
	if (deviceCache) {
		Clog('Disconnecting from "' + deviceCache.name + '" bluetooth device...');
		if (deviceCache.gatt.connected) {
			if (characteristicVTH) {
				characteristicVTH.stopNotifications()
                .then(_ => {
					Clog('Notifications stopped');
					characteristicVTH = null;
				  	if (deviceCache.gatt.connected) {
						deviceCache.gatt.disconnect();
					}
					deviceCache.removeEventListener('gattserverdisconnected', handleDisconnection);
					deviceCache = null;
					Clog('Disconnected. Load '+memo.length+' samples.' );
					
					//conmutaVisualizacionDiv("divGeneral");
					bajarVisualizacion();
					
					Clog("Temp: " + temperaturaActual);
					
					ShowConnect();
				})
				.catch(error => { Clog(error);
					if (characteristicVTH) {
						characteristicVTH.removeEventListener('characteristicvaluechanged', handleCharacteristicValueChanged);
						characteristicVTH = null;
					}
					deviceCache.removeEventListener('gattserverdisconnected', handleDisconnection);
					deviceCache = null;
					ShowConnect();
				});
			}
		}
		if (show_on != 0) show_graph();
	}
	else
		Clog('"' + deviceCache.name + '" bluetooth device is already disconnected');
}

/*

navigator.bluetooth.getDevices() es una función experimental y todavía está oculta detrás de una bandera (flag) de desarrollo en Chrome para Android.
>>"Use the new permissions backend for Web Bluetooth" to Enable

async function conectarDispositivoRecordado() {
  try {
    if (typeof navigator.bluetooth.getDevices === 'function') {
      const dispositivosPermitidos = await navigator.bluetooth.getDevices();
      
      if (dispositivosPermitidos.length > 0) {
        const miDispositivo = dispositivosPermitidos[rotarBtdevices];
        Clog(miDispositivo.name + ": Escuchando...");
  
        if (miDispositivo.gatt.connected) {								 // 1. Si ya está conectado por algún motivo, no hacemos nada
          Clog("Ya estaba conectado.");
          return;
        }

        const controladorAbortar = new AbortController();				 // 1. CREAMOS EL CONTROLADOR PARA PODER APAGAR EL ESCANEO DESPUÉS
              
        const esperarDispositivoEnRango = new Promise((resolve) => {	// Creamos una promesa que se resolverá en cuanto el móvil capte al dispositivo
          const alDetectarSenal = (evento) => {							// Esta función se ejecuta cuando el móvil recibe una señal de TU dispositivo
            Clog("¡Dispositivo en rango detectado por el escáner!");			
            controladorAbortar.abort(); 								// 2. APAGAMOS EL ESCANEO: Llamamos a abort() para desactivar watchAdvertisements
            Clog("Escaneo nativo desactivado para ahorrar batería.");
            miDispositivo.removeEventListener('advertisementreceived', alDetectarSenal);	// Dejamos de escuchar para no gastar batería
            resolve();
          };
          
          miDispositivo.addEventListener('advertisementreceived', alDetectarSenal);
        });
  
        await miDispositivo.watchAdvertisements({ signal: controladorAbortar.signal });		// 3. PASAMOS LA SEÑAL al activar el escaneo nativo sobre este dispositivo específico   
        await esperarDispositivoEnRango;								// 3. Esperamos a que aparezca físicamente en rango

        // 4. Ahora que sabemos con certeza que está en rango, nos conectamos de forma segura
		Clog("sabemos con certeza que está en rango,...");
		
		deviceName = miDispositivo.name;
		deviceCache = miDispositivo;
		deviceConnected = miDispositivo.name;
		deviceCache.addEventListener('gattserverdisconnected', handleDisconnection);
		
		connectDeviceAndCacheCharacteristic(miDispositivo);
		/*
        await miDispositivo.gatt.connect();					// Estableciendo conexión GATT...
        Clog("¡Conectado automáticamente y con éxito!");
		*/
        return; 
      }
    }
    
    // Si no está soportado o la lista está vacía... (Abrir el conector de siempre)
    Clog("No se puede autoconectar.");

  } catch (error) {
    console.error("Error detallado en la auto-conexión:", error);
	Clog("Error en la autoconexión: " + error);
  }
}

/**

 * 2. Toma ese dispositivo y lee la temperatura actual.
 */
async function test() {
    try {
        // Pasos 1: Esperamos a que el usuario seleccione el termómetro de la lista
        const dispositivo = await obtenerDispositivo();
        
        // Paso 2: Pasamos el dispositivo obtenido a la función de lectura

}


/**
 * Solicita al usuario permiso para conectarse al termómetro Bluetooth.
 * @returns {Promise<BluetoothDevice>} El objeto device listo para usar.
 */
function obtenerDispositivo() {
    Clog('Abriendo selector de dispositivos Bluetooth...');

    // Configuramos los filtros para que solo muestre el termómetro y no otros aparatos
    const opciones = {
        filters: [
            { services: [0x1F10] } // Filtra por el ID del servicio principal de tu código
        ],
        optionalServices: [0x1F10] // Asegura que el navegador nos dé acceso a este servicio
    };
	
	var deviceOptions = {optionalServices: [0xfe95, 0x181a, 0x1f10]};
	const namePrefix = $('namePrefix').value;
	if (namePrefix) {
		deviceOptions.acceptAllDevices = false;
		deviceOptions.filters = namePrefix.split(",")
			.map((x) => ({ namePrefix: x }));
	} else {
		deviceOptions.filters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ abcdefghijklmnopqrstuvwxyz_#@!*0123456789';,.<>{}[]"
		.split("").map((x) => ({namePrefix:x}));
	}
	
	

    return navigator.bluetooth.requestDevice(deviceOptions)
        .then(device => {
            Clog("✅ Dispositivo seleccionado: ${device.name} (ID: ${device.id})");
            
            // Opcional: Escuchar si el dispositivo se desconecta inesperadamente
            device.addEventListener('gattserverdisconnected', () => {
                Clog('⚠️ El dispositivo se ha desconectado de forma inesperada.');
            });

            return device; // Devolvemos el objeto device
        })
        .catch(error => {
            console.error('❌ El usuario canceló la selección o Bluetooth no está disponible:', error);
            throw error;
        });
}





/**
 * Se conecta al termómetro, activa la medición en vivo con el comando 0x33,
 * muestra la temperatura/humedad actual y se desconecta.
 * @param {BluetoothDevice} device - El objeto del dispositivo Bluetooth ya seleccionado.
 */
function obtenerLecturaActual(device) {
    Clog('Conectando al termómetro...');
    
    device.gatt.connect()
    .then(server => {
        Clog('Servidor GATT conectado, buscando servicio...');
        return server.getPrimaryService(0x1F10);
    })
    .then(service => {
        Clog('Servicio encontrado, buscando característica...');
        return service.getCharacteristic(0x1F1F);
    })
    .then(characteristic => {
        Clog('Característica encontrada. Activando notificaciones...');
              
        let characteristicVTH = characteristic;		// Guardamos la referencia para poder usarla dentro de los eventos
        
        return characteristicVTH.startNotifications().then(_ => {		// 1. Activamos las notificaciones de la API Web Bluetooth
            Clog('Notificaciones Web Bluetooth listas.');
            
			characteristicVTH.addEventListener('characteristicvaluechanged', function escuhaLectura(event) {		// 2. Creamos el escuchador exclusivo para la lectura en tiempo real
                let value = event.target.value;
                let len = value.byteLength;
                
                if (len > 0) {
                    let blkid = value.getUint8(0);
                    
                    // Verificamos si es el paquete de medición en vivo (0x33 o datos directos)
                    if (blkid === 0x33 && len >= 7) {
                        // Estructura estándar del comando 0x33 del firmware pvvx:
                        // byte 0: 0x33
                        // byte 1-2: Temperatura (Int16, Little Endian)
                        // byte 3-4: Humedad (Uint16, Little Endian)
                        // byte 5-6: Voltaje de batería (Uint16, Little Endian)
                        
                        let temp = value.getInt16(1, true) / 100.0;
                        let humi = value.getUint16(3, true) / 100.0;
                        let vbat = value.getUint16(5, true);
                        
                        // Mostramos los resultados finales por consola
                        console.log("LECTURA ACTUAL:");
						console.log(" Temperatura: " + temp.toFixed(2) + " °C");
                        console.log(" Humedad: " + humi.toFixed(2) +  "%");
                        console.log(" Batería: ${vbat} mV");
                        
                        // 4. Limpieza: Removemos el escuchador y desconectamos el dispositivo ya que sinó creo que sigue mandando datos.
                        characteristicVTH.removeEventListener('characteristicvaluechanged', escuhaLectura);
                        if (device.gatt.connected) {
                            device.gatt.disconnect();
                            Clog('Dispositivo desconectado correctamente tras la lectura.');
                        }
                    }
                }
            });
            
            // 3. Enviamos el comando de activación 0x33 al termómetro
            Clog('Enviando comando 0x33 (Medición en vivo)...');
            return characteristicVTH.writeValue(new Uint8Array([0x33]));
        });
    })
    .catch(error => {
        console.error(" Error en el proceso de lectura: ", error);
        if (device && device.gatt.connected) {
            device.gatt.disconnect();
        }
    });
}
